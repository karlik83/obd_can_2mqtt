; Standalone test project: a simulated vehicle ECU on a second ESP32-S3.
; Answers OBD2 requests (service 0x01/0x03/0x04/0x09) over native CAN (TWAI)
; and is used to test ../../src/obd_can.cpp WITHOUT a real vehicle.
;
; Board: LilyGO T7-S3 (ESP32-S3-WROOM-1-N16R8), CAN transceiver: SN65HVD230
;        (use a Waveshare board, not a CJMCU-230 - see README.md)
; Pins:  TX=GPIO13, RX=GPIO14 (see src/main.cpp)
;
; Build & flash:  pio run -e fake-ecu -t upload
; Serial log:     pio device monitor -e fake-ecu

[env:fake-ecu]
platform = espressif32 @ ^6.11.0
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; The T7-S3 only has the native USB port (no USB-UART chip) -> route Serial
    ; over USB-CDC, otherwise the log ends up on UART0 (GPIO43/44) and is lost.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
