; Standalone-Testprojekt: simulierte Fahrzeug-ECU auf einem zweiten ESP32-S3.
; Beantwortet OBD2-Anfragen (Service 0x01/0x03/0x04/0x09) ueber native CAN
; (TWAI) und dient zum Test von ../../src/obd_can.cpp OHNE echtes Fahrzeug.
;
; Board: LilyGO T7-S3 (ESP32-S3-WROOM-1-N16R8), CAN: SN65HVD230
; Pins:  TX=GPIO13, RX=GPIO14 (siehe src/main.cpp)
;
; Build & Flash:  pio run -e fake-ecu -t upload
; Serieller Log:  pio device monitor -e fake-ecu

[env:fake-ecu]
platform = espressif32 @ ^6.11.0
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; T7-S3 hat nur den nativen USB-Port (kein USB-UART-Chip) -> Serial ueber
    ; USB-CDC ausgeben, sonst landet der Log auf UART0 (GPIO43/44) im Nichts.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
